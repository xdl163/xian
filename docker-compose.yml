version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: xian-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: ${TZ}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xian-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: 1
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      VIDEO_PATH: /app/videos
      VIDEO_OUTPUT_PATH: /app/video_output
      SAVE_IMG_PATH: /app/save_images
      TZ: ${TZ}
    ports:
      - "${APP_PORT}:5000"
    volumes:
      - ./:/app
      - ${HOST_VIDEO_PATH}:/app/videos
      - ${HOST_VIDEO_OUTPUT_PATH}:/app/video_output
      - ${HOST_SAVE_IMG_PATH}:/app/save_images

volumes:
  mysql_data:
