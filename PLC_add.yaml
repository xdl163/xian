modbus:
  unit_id: 201          # 只有地址=201 的请求会得到应答（TCP/RTU 都一样）
  num: 350              # 保持寄存器数量
  host: 0.0.0.0         # 可选；不写默认 0.0.0.0
  port: 502             # TCP 端口
#  rtu_port: "COM10"     # 设为 null 或删除即可只跑 TCP
  baudrate: 9600
  stopbits: 1
  bytesize: 8
  parity: "N"
  timeout: 1            # 串口 read -timeout（秒）

