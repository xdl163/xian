<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>断线检测</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body>
  <main class="container">
    <h2>断线检测（Web）</h2>
    <section class="home-layout">
      <div class="panel">
        <h3 id="previewTitle">预览</h3>
        <div class="preview-box preview-stage">
          <canvas id="previewFrameCanvas" class="preview-canvas"></canvas>
          <canvas id="previewOverlay"></canvas>
        </div>
      </div>

      <aside>
        <section class="panel">
          <div class="btn-row" style="margin-bottom:8px;">
            <button id="openSettingsBtn" type="button">设置</button>
            <button id="addCameraBtn" type="button">添加摄像头</button>
            <button id="openLogsBtn" type="button">日志</button>
            <button id="openPlcSettingsBtn" type="button">PLC设置</button>
          </div>
          <h3>摄像头列表</h3>
          <label class="inline-check"><input id="toggleDraw" type="checkbox" checked /> 绘制识别框</label>
          <table class="table" id="videoTable">
            <thead><tr><th>id</th><th>识别</th><th>标注</th><th>录制</th><th>录制文件</th></tr></thead>
            <tbody>
            {% for video in videos %}
              <tr data-id="{{ video.id }}">
                <td><button class="btn-link id-btn" data-id="{{ video.id }}">{{ video.id }} | {{ video.video_id if video.video_id is not none else '' }} | {{ video.add_type if video.add_type is not none else '' }}</button></td>
                <td><input class="recognition-toggle" data-id="{{ video.id }}" type="checkbox" {% if video.enable_recognition %}checked{% endif %} /></td>
                <td><button class="annotate-btn" data-id="{{ video.id }}">标注</button></td>
                <td><button class="record-btn" data-id="{{ video.id }}">开始录制</button></td>
                <td><button class="record-list-btn" data-id="{{ video.id }}">查看录制文件</button></td>
              </tr>
            {% endfor %}
            </tbody>
          </table>
          <p id="homeMsg" class="tip"></p>
        </section>
      </aside>
    </section>
  </main>

  <div id="modalMask" class="modal-mask hidden">
    <div class="modal-card">
      <h4 id="modalTitle">标题</h4>
      <div id="modalBody"></div>
      <div class="btn-row modal-actions">
        <button id="modalOkBtn" type="button">确定</button>
        <button id="modalCancelBtn" type="button">取消</button>
      </div>
    </div>
  </div>

  <script>window.INIT_VIDEO_ID = {{ videos[0].id if videos else -1 }};</script>
  <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
